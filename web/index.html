<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNES Emulator Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    h1 { color: #00ff88; font-size: 1.4em; margin-bottom: 10px; letter-spacing: 2px; }

    #status-bar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      background: #111; border: 1px solid #333; border-radius: 4px;
      padding: 6px 12px; margin-bottom: 10px; font-size: 0.78em; width: 100%; max-width: 560px;
    }
    #conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f00; flex-shrink: 0; transition: background 0.3s;
    }
    #conn-dot.connected { background: #0f0; }
    #fps-display { color: #0f0; }
    #apu-display { color: #0af; }
    #rom-display { color: #fa0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    #screen-wrap {
      position: relative;
      border: 2px solid #00ff88;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0,255,136,0.2);
    }
    #screen {
      display: block;
      width: 512px; height: 448px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
    }
    #overlay {
      position: absolute; top: 4px; left: 4px;
      font-size: 10px; color: rgba(0,255,0,0.7);
      pointer-events: none;
    }
    #loading-msg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #00ff88; font-size: 0.9em; text-align: center; pointer-events: none;
    }

    #rom-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-top: 10px; width: 100%; max-width: 560px;
    }
    #rom-select {
      flex: 1; background: #181818; color: #e0e0e0; border: 1px solid #444;
      border-radius: 4px; padding: 5px 8px; font-family: monospace; font-size: 0.78em;
    }
    .action-btn {
      background: #222; color: #ccc; border: 1px solid #555; border-radius: 4px;
      padding: 5px 12px; cursor: pointer; font-family: monospace; font-size: 0.78em;
      white-space: nowrap; transition: background 0.1s, border-color 0.1s;
    }
    .action-btn:hover { border-color: #00ff88; color: #00ff88; }
    .action-btn.danger:hover { border-color: #f55; color: #f55; }

    #upload-bar {
      display: flex; gap: 8px; align-items: center;
      margin-top: 6px; width: 100%; max-width: 560px;
    }
    #upload-label {
      flex: 1; background: #181818; color: #888; border: 1px dashed #444;
      border-radius: 4px; padding: 5px 10px; font-family: monospace; font-size: 0.78em;
      cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; transition: border-color 0.1s, color 0.1s;
    }
    #upload-label:hover, #upload-label.drag { border-color: #00ff88; color: #00ff88; }
    #upload-input { display: none; }
    #upload-progress { color: #0af; font-size: 0.75em; display: none; }

    #controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 560px; width: 100%;
    }
    .ctrl-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .ctrl-group label { font-size: 0.7em; color: #666; margin-bottom: 2px; }
    .dpad  { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; gap: 2px; }
    .face-btns { display: grid; grid-template-areas: ". x ." "y . a" ". b ."; gap: 4px; }
    .menu-btns     { display: flex; gap: 6px; }
    .shoulder-btns { display: flex; gap: 6px; }

    .btn {
      background: #1e1e1e; color: #ccc;
      border: 1px solid #444; border-radius: 4px;
      padding: 7px 11px; cursor: pointer;
      font-family: monospace; font-size: 0.8em;
      user-select: none; min-width: 38px; text-align: center;
      transition: background 0.05s, border-color 0.05s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: #00ff88; }
    .btn.active, .btn:active { background: #00ff88; color: #000; border-color: #00ff88; }
    [data-btn="UP"]    { grid-area: u; }
    [data-btn="DOWN"]  { grid-area: d; }
    [data-btn="LEFT"]  { grid-area: l; }
    [data-btn="RIGHT"] { grid-area: r; }
    [data-btn="A"]     { grid-area: a; }
    [data-btn="B"]     { grid-area: b; }
    [data-btn="X"]     { grid-area: x; }
    [data-btn="Y"]     { grid-area: y; }

    #key-hint { margin-top: 10px; color: #444; font-size: 0.68em; text-align: center; }
  </style>
</head>
<body>
  <h1>SNES EMULATOR ONLINE</h1>

  <div id="status-bar">
    <span id="conn-dot"></span>
    <span id="conn-label">연결 중...</span>
    <span id="fps-display">FPS: --</span>
    <span id="apu-display">APU: --</span>
    <span id="rom-display">ROM: --</span>
  </div>

  <div id="screen-wrap">
    <canvas id="screen" width="256" height="224"></canvas>
    <div id="overlay"></div>
    <div id="loading-msg">연결 대기 중...</div>
  </div>

  <div id="rom-bar">
    <select id="rom-select"><option value="">-- ROM 선택 --</option></select>
    <button class="action-btn" id="load-btn">불러오기</button>
    <button class="action-btn danger" id="reset-btn">리셋</button>
  </div>

  <div id="upload-bar">
    <label id="upload-label" for="upload-input">▲ ROM 파일 드래그 또는 클릭하여 업로드 (.sfc/.smc)</label>
    <input id="upload-input" type="file" accept=".sfc,.smc">
    <span id="upload-progress"></span>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <label>D-PAD</label>
      <div class="dpad">
        <button class="btn" data-btn="UP">▲</button>
        <button class="btn" data-btn="LEFT">◀</button>
        <button class="btn" data-btn="DOWN">▼</button>
        <button class="btn" data-btn="RIGHT">▶</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>BUTTONS</label>
      <div class="face-btns">
        <button class="btn" data-btn="X">X</button>
        <button class="btn" data-btn="Y">Y</button>
        <button class="btn" data-btn="A">A</button>
        <button class="btn" data-btn="B">B</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>MENU</label>
      <div class="menu-btns">
        <button class="btn" data-btn="SELECT">SEL</button>
        <button class="btn" data-btn="START">START</button>
      </div>
    </div>
    <div class="ctrl-group">
      <label>SHOULDER</label>
      <div class="shoulder-btns">
        <button class="btn" data-btn="L">L</button>
        <button class="btn" data-btn="R">R</button>
      </div>
    </div>
  </div>

  <div id="key-hint">
    방향키 | Z=B &nbsp; X=A &nbsp; A=Y &nbsp; S=X &nbsp; D=L &nbsp; F=R &nbsp; Q=SELECT &nbsp; E=START
  </div>

  <script>
    'use strict';

    const canvas    = document.getElementById('screen');
    const ctx       = canvas.getContext('2d');
    const connDot   = document.getElementById('conn-dot');
    const connLabel = document.getElementById('conn-label');
    const fpsDisp   = document.getElementById('fps-display');
    const apuDisp   = document.getElementById('apu-display');
    const romDisp   = document.getElementById('rom-display');
    const overlay   = document.getElementById('overlay');
    const loadingMsg= document.getElementById('loading-msg');
    const romSelect = document.getElementById('rom-select');
    const loadBtn   = document.getElementById('load-btn');
    const resetBtn  = document.getElementById('reset-btn');

    const W = 256, H = 224;
    const RGBA_SIZE = W * H * 4;
    let imgData = ctx.createImageData(W, H);
    let firstFrame = false;

    // FPS
    let totalFrames = 0, lastFpsTime = performance.now(), lastFpsFrames = 0;

    // WebSocket
    let ws = null;

    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        connDot.classList.add('connected');
        connLabel.textContent = '연결됨';
        loadROMs();
      };

      ws.onclose = () => {
        connDot.classList.remove('connected');
        connLabel.textContent = '연결 끊김 - 재연결 중...';
        setTimeout(connect, 2000);
      };

      ws.onerror = () => { connLabel.textContent = '오류'; };

      ws.onmessage = (e) => {
        // JSON control message
        if (typeof e.data === 'string') {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'rom_changed') {
              romDisp.textContent = 'ROM: ' + msg.rom;
              firstFrame = false;
              loadingMsg.style.display = 'block';
              loadingMsg.textContent = msg.rom + ' 로딩 중...';
            }
          } catch(ex) {}
          return;
        }

        // Binary frame
        const raw = new Uint8Array(e.data);
        if (raw.length < 8 + RGBA_SIZE) return;

        if (!firstFrame) {
          firstFrame = true;
          loadingMsg.style.display = 'none';
        }

        const fn = raw[0] | (raw[1]<<8) | (raw[2]<<16) | (raw[3]<<24);
        const p0 = raw[4], p1 = raw[5], p2 = raw[6], p3 = raw[7];

        imgData.data.set(raw.subarray(8, 8 + RGBA_SIZE));
        ctx.putImageData(imgData, 0, 0);
        totalFrames++;

        // APU display
        apuDisp.textContent = `APU: ${hex2(p0)} ${hex2(p1)} ${hex2(p2)} ${hex2(p3)}`;
        if (p0 === 0xFF) {
          apuDisp.style.color = '#0f0';
          overlay.textContent = 'SPC TEST PASS';
        } else if (p2 === 0x02) {
          apuDisp.style.color = '#f55';
          overlay.textContent = 'SPC TEST FAIL';
        } else {
          apuDisp.style.color = '#0af';
          overlay.textContent = '';
        }

        // FPS counter
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          const fps = ((totalFrames - lastFpsFrames) * 1000 / (now - lastFpsTime)).toFixed(1);
          fpsDisp.textContent = `FPS: ${fps} | F#${fn}`;
          lastFpsTime = now;
          lastFpsFrames = totalFrames;
        }
      };
    }

    function hex2(v) { return v.toString(16).padStart(2,'0').toUpperCase(); }

    // ── ROM selection ─────────────────────────────────────────────────────────
    async function loadROMs() {
      try {
        const res = await fetch('/roms');
        const data = await res.json();
        romSelect.innerHTML = '<option value="">-- ROM 선택 --</option>';
        for (const rom of data.roms) {
          const opt = document.createElement('option');
          opt.value = rom;
          opt.textContent = rom;
          if (rom === data.current) opt.selected = true;
          romSelect.appendChild(opt);
        }
        romDisp.textContent = 'ROM: ' + (data.current || '--');
      } catch(e) {
        console.error('loadROMs error:', e);
      }
    }

    loadBtn.onclick = async () => {
      const rom = romSelect.value;
      if (!rom) return;
      loadBtn.disabled = true;
      try {
        await fetch('/load', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rom })
        });
      } finally {
        loadBtn.disabled = false;
      }
    };

    resetBtn.onclick = async () => {
      resetBtn.disabled = true;
      try { await fetch('/reset', { method: 'POST' }); } finally {
        resetBtn.disabled = false;
      }
    };

    connect();

    // ── Controller input ──────────────────────────────────────────────────────
    function sendBtn(name, pressed) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(`BTN ${name} ${pressed ? 1 : 0}`);
      }
    }

    document.querySelectorAll('.btn[data-btn]').forEach(btn => {
      const name = btn.dataset.btn;
      const press   = (e) => { e.preventDefault(); sendBtn(name, true);  btn.classList.add('active'); };
      const release = (e) => { e.preventDefault(); sendBtn(name, false); btn.classList.remove('active'); };
      btn.addEventListener('mousedown',  press);
      btn.addEventListener('touchstart', press,   { passive: false });
      btn.addEventListener('mouseup',    release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('touchend',   release, { passive: false });
      btn.addEventListener('touchcancel',release, { passive: false });
    });

    const KEY_MAP = {
      ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
      z:'B', x:'A', a:'Y', s:'X', d:'L', f:'R', q:'SELECT', e:'START',
      Z:'B', X:'A', A:'Y', S:'X', D:'L', F:'R', Q:'SELECT', E:'START'
    };
    const held = new Set();
    document.addEventListener('keydown', ev => {
      const btn = KEY_MAP[ev.key];
      if (!btn) return;
      ev.preventDefault();
      if (!held.has(btn)) { held.add(btn); sendBtn(btn, true); }
    });
    document.addEventListener('keyup', ev => {
      const btn = KEY_MAP[ev.key];
      if (!btn) return;
      ev.preventDefault();
      held.delete(btn);
      sendBtn(btn, false);
    });

    // ── File upload ───────────────────────────────────────────────────────────
    const uploadInput = document.getElementById('upload-input');
    const uploadLabel = document.getElementById('upload-label');
    const uploadProg  = document.getElementById('upload-progress');

    async function uploadFile(file) {
      if (!file) return;
      if (!file.name.match(/\.(sfc|smc)$/i)) {
        uploadProg.style.display = 'inline';
        uploadProg.textContent = '오류: .sfc/.smc 파일만 업로드 가능';
        return;
      }
      uploadProg.style.display = 'inline';
      uploadProg.textContent = `업로드 중: ${file.name}...`;
      uploadLabel.textContent = file.name;
      const form = new FormData();
      form.append('rom', file, file.name);
      try {
        const res = await fetch('/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (data.ok) {
          uploadProg.textContent = `완료: ${data.rom}`;
          await loadROMs();
        } else {
          uploadProg.textContent = `오류: ${data.error}`;
        }
      } catch(e) {
        uploadProg.textContent = `업로드 실패: ${e.message}`;
      }
      setTimeout(() => { uploadProg.style.display = 'none'; }, 4000);
    }

    uploadInput.addEventListener('change', () => uploadFile(uploadInput.files[0]));

    // Drag & drop onto the label
    uploadLabel.addEventListener('dragover',  e => { e.preventDefault(); uploadLabel.classList.add('drag'); });
    uploadLabel.addEventListener('dragleave', () => uploadLabel.classList.remove('drag'));
    uploadLabel.addEventListener('drop', e => {
      e.preventDefault();
      uploadLabel.classList.remove('drag');
      uploadFile(e.dataTransfer.files[0]);
    });

    // Drag & drop onto the canvas
    const screenWrap = document.getElementById('screen-wrap');
    screenWrap.addEventListener('dragover',  e => { e.preventDefault(); screenWrap.style.borderColor = '#00ff88'; });
    screenWrap.addEventListener('dragleave', () => { screenWrap.style.borderColor = ''; });
    screenWrap.addEventListener('drop', e => {
      e.preventDefault();
      screenWrap.style.borderColor = '';
      uploadFile(e.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
